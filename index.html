<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">

<title id="docTitle">المحرر العربي الاحترافي</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>

[data-theme=dark]{--bg:#121815;--sf:#1a231e;--tx:#e2e8e5;--ln:#2c3832;--ac:#19866b;--al:#22332b;--mu:#9ca3af;--pb:#161d19;--pt:#e2e8e5}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.7 Cairo,Tahoma,"Segoe UI",Arial,sans-serif;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
button,input,select,textarea{font:inherit}
button{cursor:pointer;touch-action:manipulation}
.header{background:var(--ac);color:#fff;padding:6px 14px;display:flex;justify-content:space-between;align-items:center}
.header h1{font-size:15px;margin:0}
.author{font-size:11px;line-height:1.4;text-align:left}
.toolbar{position:sticky;top:0;z-index:50;background:var(--sf);box-shadow:0 1px 4px rgba(0,0,0,.12);padding:3px 8px}
.mbar,.quick{display:flex;align-items:center;gap:2px;overflow-x:auto;scrollbar-width:none}
.mbar::-webkit-scrollbar,.quick::-webkit-scrollbar{display:none}
.mbar{padding-bottom:3px;margin-bottom:3px}
.mbar button{flex:0 0 auto;border:0;background:none;color:var(--tx);padding:4px 10px;min-height:36px;border-radius:4px;font-size:14px}
.mbar button.on,.mbar button:hover,.quick button:hover{background:var(--al)}
.quick button{flex:0 0 auto;min-width:36px;min-height:36px;border:0;background:none;color:var(--tx);border-radius:4px;padding:0 8px;font-size:15px;display:inline-flex;align-items:center;justify-content:center}
.quick .pr{font-weight:700;color:var(--ac);font-size:13px}
.quick select{flex:0 0 auto;height:34px;max-width:110px;border:0;border-radius:4px;background:var(--al);color:var(--tx);font-size:13px}
.quick input[type=color]{flex:0 0 auto;width:30px;height:30px;border:0;padding:0;background:none}
.sep{flex:0 0 1px;height:20px;background:var(--ln);margin:0 4px}
.menu{position:absolute;top:100%;right:8px;width:min(270px,94vw);max-height:70vh;overflow-y:auto;background:var(--sf);border:0;border-radius:6px;box-shadow:0 6px 20px rgba(0,0,0,.25);padding:4px;z-index:60}
.menu[hidden]{display:none}
.menu button,.menu select,.m-l{display:flex;width:100%;align-items:center;justify-content:space-between;min-height:38px;border:0;border-radius:4px;background:transparent;color:var(--tx);padding:4px 10px;text-align:right;font-size:14px}
.menu button:hover{background:var(--al)}
.menu select{border:0;margin:3px 0;background:var(--al)}
.menu .dg{color:var(--dg)}
.m-l input{width:34px;height:26px;border:0;padding:0;background:none}
.ew{padding:10px 6px;display:flex;justify-content:center}
#page{background:var(--pb);color:var(--pt);width:794px;max-width:100%;min-height:78vh;padding:var(--pp,57px);outline:0;box-shadow:0 1px 6px rgba(0,0,0,.12);border:0;border-radius:0;font-size:19px;line-height:2;overflow-wrap:anywhere}
#page.empty>p:first-child:before,#page.empty:empty:before{content:"اكتب هنا...";color:var(--mu);pointer-events:none}
#page p{margin:0 0 12px}
#page img{max-width:100%;height:auto;display:block;margin:16px auto;cursor:pointer}
#page table{width:100%;border-collapse:collapse;margin:16px 0}
#page td,#page th{border:1px solid var(--ln);padding:6px 8px;min-width:40px}
#page th{font-weight:700}
#page blockquote{border-right:3px solid var(--ln);margin:14px 0;padding:2px 14px;color:var(--mu)}
#page ul,#page ol{padding-right:32px}
#page hr{border:0;border-top:1px solid var(--ln)}
#page .pb{border-top:1px dashed var(--mu);margin:26px 0;height:1px;break-after:page;page-break-after:always}
#page img.sel{outline:2px solid var(--ac)}
.sb{position:sticky;bottom:0;z-index:40;display:flex;gap:14px;align-items:center;flex-wrap:wrap;background:var(--sf);box-shadow:0 -1px 4px rgba(0,0,0,.1);padding:4px 12px;font-size:12px;color:var(--mu)}
.sb b{color:var(--tx)}
#status{color:var(--ac);font-weight:700;margin-inline-start:auto}
.panel{max-width:900px;width:calc(100% - 16px);margin:8px auto;background:var(--sf);border:0;border-radius:6px;padding:10px;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.panel h3{margin:0 0 6px;font-size:15px;color:var(--ac)}
.panel textarea,.modal input{width:100%;padding:8px;border:0;border-radius:4px;background:var(--al);color:var(--tx);margin:4px 0}
.panel textarea{min-height:150px}
.panel button,.modal button{min-height:38px;padding:4px 12px;border:0;background:var(--al);color:var(--tx);border-radius:4px;margin:2px;font-size:14px}
.row{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.footer{text-align:center;color:var(--mu);font-size:12px;padding:10px}
[hidden]{display:none!important}
.bd{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--sf);color:var(--tx);border-radius:8px;padding:14px;width:min(420px,100%);max-height:85vh;overflow:auto}
.modal h3{margin:0 0 6px;font-size:16px}
.di{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}
@media(max-width:600px){#page{padding:clamp(14px,4vw,24px);font-size:18px}}
@media print{
@page{size:A4;margin:15mm}
html,body{background:#fff!important;color:#000!important}
.header,.toolbar,.sb,.panel,.footer,.bd{display:none!important}
.ew{display:block;padding:0!important}
#page{width:auto!important;max-width:none!important;min-height:0!important;padding:0!important;margin:0!important;border:0!important;box-shadow:none!important;background:#fff!important;color:#000!important}
#page img{max-width:100%!important;break-inside:avoid}
#page table{break-inside:auto}
#page tr{break-inside:avoid}
#page .pb{break-after:page;page-break-after:always}
}
</style>
</head>
<body>

<div class="header">
  <h1>✍️ المحرر العربي الاحترافي</h1>

</div>

<script>
"use strict";
const $=id=>document.getElementById(id);
const page=$("page"),DB="ArabicProDocsDB",ST="documents";
let curId=null,title="مستند جديد",range0=null,timer=null,selImg=null,stT=null;
let rev=0,savedRev=0,queue=Promise.resolve(),sIdx=-1,sM=[];
let cfg={size:"A4",margin:15,pattern:"none",direction:"rtl"};
const SIZES={ A4:{w:794,pdf:"a4"}, A5:{w:559,pdf:"a5"}, Letter:{w:816,pdf:"letter"} };
const FONTS=["Cairo","Tahoma","Arial","Traditional Arabic","Simplified Arabic","Georgia","Times New Roman","Amiri"];
const FS=[["14px","14 صغير"],["16px","16 عادي"],["18px","18"],["20px","20"],["24px","24 كبير"],["28px","28"],["32px","32 عنوان"],["40px","40"]];
const BLOCKS=[["<p>","فقرة"],["<h1>","عنوان 1"],["<h2>","عنوان 2"],["<h3>","عنوان 3"]];
const MARGINS=[["10","10 مم"],["15","15 مم"],["20","20 مم"],["25","25 مم"]];
const MENU=[
  {t:"📁 ملف",i:[["＋ مستند جديد",()=>newDoc()],["📚 مستنداتي",()=>openDocs()],["💾 حفظ الآن",()=>saveNow(false)],["✏️ تسمية المستند",()=>renameDoc()],["📥 جلب ملف (Word/PDF/TXT/HTML)",()=>$("importInput").click()],["🖨 طباعة",()=>window.print()],["🗑 مسح المحتوى",()=>clearDoc(),"dg"]]},
  {t:"📤 تصدير",i:[["📝 Word ‏(.docx)",()=>exportDOCX()],["📄 PDF",()=>exportPDF()],["🖼 صورة PNG",()=>exportImage(false)],["🖼 صور بالصفحات",()=>exportImage(true)],["🌐 HTML",()=>exportHTML()],["📃 TXT",()=>exportTXT()]]},
  {t:"📑 PDF وOCR",i:[["🔄 تحويل PDF إلى Word",()=>$("p2wInput").click()],["🖼 استيراد PDF كصور (طبق الأصل)",()=>$("pdfImgInput").click()],["📖 قراءة نص PDF",()=>$("pdfInput").click()],["👁️ OCR لصورة",()=>$("ocrInput").click()],["📜 عرض النص المستخرج",()=>showX()]]},
  {t:"🎨 المظهر",i:[["☀️ نهار",()=>setTheme("light")],["📜 ورق",()=>setTheme("sepia")],["🌙 داكن",()=>setTheme("dark")]]},
  {t:"✏️ تنسيق النص",i:[["غامق",()=>cmd("bold")],["مائل",()=>cmd("italic")],["تسطير",()=>cmd("underline")],["يتوسطه خط",()=>cmd("strikeThrough")],["إزالة التنسيق",()=>cmd("removeFormat")],["↶ تراجع",()=>cmd("undo")],["↷ إعادة",()=>cmd("redo")]]},
  {t:"🔤 الخط واللون",i:[{s:1,ph:"نوع الخط",o:FONTS.map(x=>[x,x]),f:v=>cmd("fontName",v)},{s:1,ph:"حجم الخط",o:FS,f:v=>setSize(v)},{c:1,l:"لون النص",v:"#111111",f:v=>cmd("foreColor",v)},{c:1,l:"تمييز النص",v:"#fff176",f:v=>cmd("hiliteColor",v)}]},
  {t:"☰ الفقرة",i:[["يمين",()=>cmd("justifyRight")],["وسط",()=>cmd("justifyCenter")],["يسار",()=>cmd("justifyLeft")],["ضبط",()=>cmd("justifyFull")],["• قائمة نقطية",()=>cmd("insertUnorderedList")],["١. قائمة رقمية",()=>cmd("insertOrderedList")],["اتجاه RTL",()=>setDir("rtl")],["اتجاه LTR",()=>setDir("ltr")]]},
  {t:"➕ إدراج",i:[["عنوان H1",()=>cmd("formatBlock","<h1>")],["عنوان H2",()=>cmd("formatBlock","<h2>")],["عنوان H3",()=>cmd("formatBlock","<h3>")],["خط فاصل",()=>ins("<hr><p><br></p>")],["اقتباس",()=>ins("<blockquote>اكتب الاقتباس...</blockquote><p><br></p>")],["📊 جدول",()=>insTable()],["＋ صف",()=>tRow()],["＋ عمود",()=>tCol()],["فاصل صفحة",()=>ins('<div class="pb"></div><p><br></p>')],["📷 رفع صورة",()=>pickImg()],["🔗 رابط",()=>link()],["إزالة الرابط",()=>cmd("unlink")]]},
  {t:"📄 الصفحة",i:[{s:1,id:"paperSize",ph:"حجم الورق",o:[["A4","A4"],["A5","A5"],["Letter","Letter"]],f:v=>{cfg.size=v;applyCfg();sched()},keep:1},{s:1,id:"marginSel",ph:"هوامش الصفحة",o:MARGINS,f:v=>{cfg.margin=Number(v)||15;applyCfg();sched()},keep:1},{s:1,id:"pat",ph:"نقش الخلفية",o:[["none","بدون"],["dots","نقاط"],["lines","خطوط"],["grid","مربعات"]],f:v=>setPat(v),keep:1},["🔍 بحث واستبدال",()=>openFind()]]},
  {t:"🖼 الصورة المحددة",i:[["⬇ تحميل الصورة",()=>dlImg()],["تكبير",()=>rsz(1.1)],["تصغير",()=>rsz(.9)],["يمين",()=>alImg("right")],["وسط",()=>alImg("center")],["يسار",()=>alImg("left")],["حذف الصورة",()=>delImg(),"dg"]]}
];

function status(m){$("status").textContent=m}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeName(){return(title||"مستندي").replace(/[\\/:*?"<>|]/g,"_").slice(0,100)}
function setTheme(n){document.body.dataset.theme=n;try{localStorage.setItem("ape-theme",n)}catch(e){}}
function mkItem(it){
  let el;
  if(it.s){
    el=document.createElement("select");
    if(it.id)el.id=it.id;
    el.innerHTML='<option value="">'+esc(it.ph)+"</option>"+it.o.map(o=>'<option value="'+esc(o[0])+'">'+esc(o[1])+"</option>").join("");
    if(it.id==="paperSize")el.value=cfg.size;
    if(it.id==="marginSel")el.value=String(cfg.margin);
    if(it.id==="pat")el.value=cfg.pattern;
    el.onchange=()=>{if(!el.value)return;it.f(el.value);if(!it.keep)el.selectedIndex=0;closeMenu()};
  }else if(it.c){
    el=document.createElement("label");
    el.className="m-l";
    el.innerHTML="<span>"+esc(it.l)+"</span>";
    const i=document.createElement("input");
    i.type="color";i.value=it.v;
    i.oninput=()=>it.f(i.value);
    el.appendChild(i);
  }else{
    el=document.createElement("button");
    el.textContent=it[0];
    if(it[2])el.className=it[2];
    el.onclick=()=>{closeMenu();it[1]()};
  }
  return el;
}
function buildMenu(){
  const bar=$("mbar");bar.innerHTML="";
  MENU.forEach((gr,gi)=>{
    const b=document.createElement("button");
    b.textContent=gr.t.replace(/^\S+\s/,"");
    b.onclick=e=>{e.stopPropagation();openGroup(gi,b)};
    bar.appendChild(b);
  });
}
function openGroup(gi,btn){
  const menu=$("menu");
  if(!menu.hidden&&menu.dataset.g==gi){closeMenu();return}
  closeMenu();
  menu.dataset.g=gi;
  menu.innerHTML="";
  MENU[gi].i.forEach(it=>menu.appendChild(mkItem(it)));
  menu.hidden=false;
  btn.classList.add("on");
}
function svgAl(a){
  const w=[14,9,14,6];let d="";
  w.forEach((x,i)=>{const y=3+i*3.4;const x1=a==="j"?1:a==="r"?15-x:a==="l"?1:(16-x)/2;const x2=a==="j"?15:x1+x;d+="M"+x1+" "+y+"H"+x2});
  return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="'+d+'"/></svg>';
}
function link(){
  restore();
  const u=prompt("عنوان الرابط:","https://");

  if(!/^(https?:|mailto:|tel:)/i.test(url)){if(/^[a-z][a-z0-9+.-]*:/i.test(url)){alert("عنوان الرابط غير صالح.");return}url="https://"+url}

function buildQuick(){
  const q=$("quick");

  sel("النمط",BLOCKS,v=>cmd("formatBlock",v));
  sel("الخط",FONTS.map(x=>[x,x]),v=>cmd("fontName",v));
  sel("الحجم",FS,v=>setSize(v));sep();
  btn("<b>B</b>","غامق",()=>cmd("bold"));btn("<i>I</i>","مائل",()=>cmd("italic"));btn("<u>U</u>","تسطير",()=>cmd("underline"));btn("<s>S</s>","يتوسطه خط",()=>cmd("strikeThrough"));sep();

  btn(svgAl("r"),"يمين",()=>cmd("justifyRight"));btn(svgAl("c"),"وسط",()=>cmd("justifyCenter"));btn(svgAl("l"),"يسار",()=>cmd("justifyLeft"));btn(svgAl("j"),"ضبط",()=>cmd("justifyFull"));sep();
  btn("•","قائمة نقطية",()=>cmd("insertUnorderedList"));btn("1.","قائمة رقمية",()=>cmd("insertOrderedList"));sep();

function closeMenu(){

document.addEventListener("click",e=>{if(!e.target.closest(".menu")&&!e.target.closest(".quick")&&!e.target.closest(".mbar"))closeMenu()});
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&String(e.key).toLowerCase()==="s"){e.preventDefault();saveNow(false)}});

const SAN_TAGS=new Set(("p,br,b,strong,i,em,u,s,strike,del,ins,sub,sup,mark,small,span,div,font,h1,h2,h3,h4,h5,h6,ul,ol,li,table,thead,tbody,tfoot,tr,td,th,caption,colgroup,col,blockquote,pre,code,hr,img,a").split(","));
const SAN_DROP="script,style,iframe,frame,frameset,object,embed,applet,form,link,meta,base,svg,math,template,noscript,title,video,audio,source,track,canvas,select,textarea,input,button,head";
const SAN_ATTR={"*":["style","dir","lang","align","title","class"],a:["href"],img:["src","alt","width","height"],td:["colspan","rowspan"],th:["colspan","rowspan"],col:["span"],colgroup:["span"],ol:["start","type"],font:["color","face","size"]};

function cleanStyle(v){
  return v.replace(/\/\*[\s\S]*?\*\//g,"").split(";").map(x=>x.trim()).filter(x=>x&&!/[\\<>]|url\s*\(|image\s*\(|image-set|expression|javascript|vbscript|@import|behavior|binding|^position\s*:|^z-index|^cursor\s*:|^content\s*:/i.test(x)).join(";");
}
function sanitize(html){
  const d=new DOMParser().parseFromString(String(html==null?"":html),"text/html");
  d.body.querySelectorAll(SAN_DROP).forEach(e=>e.remove());
  [...d.body.querySelectorAll("*")].forEach(el=>{
    const t=el.tagName.toLowerCase();
    if(!SAN_TAGS.has(t)){el.replaceWith(...el.childNodes);return}
    const allowed=SAN_ATTR["*"].concat(SAN_ATTR[t]||[]);
    [...el.attributes].forEach(a=>{
      const n=a.name.toLowerCase(),v=a.value.trim();
      if(!allowed.includes(n)){el.removeAttribute(a.name);return}
      if(n==="href"){if(!/^(#|https?:|mailto:|tel:)/i.test(v))el.removeAttribute(a.name)}
      else if(n==="src"){if(!/^(https:|data:image\/(png|jpe?g|gif|webp);base64,)/i.test(v))el.removeAttribute(a.name)}
      else if(n==="class"){if(v!=="pb")el.removeAttribute(a.name)}
      else if(n==="style"){const c=cleanStyle(v);c?el.setAttribute("style",c):el.removeAttribute("style")}

async function buildGroups(g){
  const root=document.createElement("div");root.innerHTML=sanitize(page.innerHTML);
  const nodes=[];let run=null;
  [...root.childNodes].forEach(n=>{
    const isBlock=n.nodeType===1&&BLOCK_RE.test(n.tagName.toLowerCase());
    if(isBlock){run=null;nodes.push(n);return}
    if(n.nodeType===3&&!n.textContent.trim())return;
    if(!run){run=document.createElement("div");nodes.push(run)}
    run.appendChild(n);
  });
  const m=mkBox(g,g.pad+"px");nodes.forEach(n=>m.appendChild(n));document.body.appendChild(m);
  try{
    await Promise.all([...m.querySelectorAll("img")].map(i=>i.complete?0:new Promise(r=>{i.onload=i.onerror=r})));
    const hs=nodes.map(n=>{if(n.classList.contains("pb"))return 0;const cs=getComputedStyle(n);return n.offsetHeight+(parseFloat(cs.marginTop)||0)+(parseFloat(cs.marginBottom)||0)});
    const groups=[];let cur=[],curH=0;
    const flush=()=>{if(cur.length)groups.push({nodes:cur,tall:false});cur=[];curH=0};
    nodes.forEach((n,i)=>{
      if(n.classList.contains("pb")){flush();return}
      const h=hs[i];if(h>g.contentH){flush();groups.push({nodes:[n],tall:true});return}
      if(curH+h>g.contentH)flush();
      cur.push(n);curH+=h;
    });
    flush();return groups.filter(grp=>grp.nodes.some(hasContent));
  }finally{m.remove()}
}

  grp.nodes.forEach(n=>box.appendChild(n));document.body.appendChild(box);
  try{
    return await html2canvas(box,{scale,backgroundColor:"#fff",useCORS:true,logging:false,scrollX:0,scrollY:0,windowWidth:g.W,onclone:doc=>{const b=doc.querySelector(".xcp");if(b){b.style.position="absolute";b.style.left="0";b.style.top="0"}}});

async function eachPage(cb,scale){
  if(typeof html2canvas==="undefined")throw new Error("html2canvas غير متاحة");
  scale=scale||2;const g=pageGeom();const groups=await buildGroups(g);
  let idx=0;
  for(const grp of groups){
    const c=await renderGroup(grp,g,scale);
    if(!grp.tall){const pc=blankPage(g,scale);pc.getContext("2d").drawImage(c,0,0);await cb(pc,idx++)}
    else{
      const cH=Math.round(g.contentH*scale),n=Math.max(1,Math.ceil(c.height/cH));
      for(let k=0;k<n;k++){
        const h=Math.min(cH,c.height-k*cH),pc=blankPage(g,scale);
        pc.getContext("2d").drawImage(c,0,k*cH,c.width,h,0,Math.round(g.pad*scale),c.width,h);
        await cb(pc,idx++);
      }
    }
    c.width=1;c.height=1;status("تجهيز الصفحات: "+idx);
  }
  return idx;
}

}
function imgRun(im){
  return new Promise(res=>{
    const i=new Image();
    i.onload=()=>{
      try{
        let w=i.naturalWidth||300,h=i.naturalHeight||200;
        const sw=parseFloat(im.style.width)||0;if(sw){h=h*sw/w;w=sw}
        const max=(SIZES[cfg.size]||SIZES.A4).w-2*Math.round(cfg.margin*3.78);
        if(w>max){h=h*max/w;w=max}
        const c=document.createElement("canvas");c.width=i.naturalWidth;c.height=i.naturalHeight;
        c.getContext("2d").drawImage(i,0,0);
        const b=atob(c.toDataURL("image/png").split(",")[1]),u=new Uint8Array(b.length);
        for(let k=0;k<b.length;k++)u[k]=b.charCodeAt(k);
        res(new docx.ImageRun({data:u,type:"png",transformation:{width:Math.round(w),height:Math.round(h)}}));
      }catch(e){res(null)}
    };
    i.onerror=()=>res(null);i.src=im.src;
  });
}
async function runs(node,st,out){
  for(const n of node.childNodes){
    if(n.nodeType===3){const t=n.textContent.replace(/[\r\n\t ]+/g," ");if(t)out.push(new docx.TextRun(fmt(st,t)))}
    else if(n.nodeType===1){
      const t=n.tagName.toLowerCase();
      if(t==="br")out.push(new docx.TextRun({break:1}));
      else if(t==="img"){const r=await imgRun(n);if(r)out.push(r)}
      else if(!/^(ul|ol|table|style|script)$/.test(t))await runs(n,styleOf(n,st),out);
    }
  }
}
function para(r,el,o){
  const ta=(el&&el.style&&el.style.textAlign)||"";
  const A=docx.AlignmentType,rtl=cfg.direction==="rtl";
  let al;
  if(ta==="center")al=A.CENTER;else if(ta==="justify")al=A.BOTH;
  else if(rtl&&ta==="left")al=A.RIGHT;else if(!rtl&&ta==="right")al=A.RIGHT;
  return new docx.Paragraph({children:r,bidirectional:rtl,alignment:al,spacing:{after:120,line:360},...(o||{})});
}
async function li2(li,t,inst,out,base,lvl){
  const r=[];await runs(li,styleOf(li,base),r);
  out.push(para(r,li,t==="ul"?{bullet:{level:lvl}}:{numbering:{reference:"n",level:lvl,instance:inst}}));
  for(const c of li.children){
    if(["ul","ol"].test(c.tagName.toLowerCase())){
      const i2=++numN;
      for(const l2 of c.children)if(l2.tagName.toLowerCase()==="li")await li2(l2,c.tagName.toLowerCase(),i2,out,base,Math.min(lvl+1,2));
    }
  }
}
async function tbl(t,base){
  const rowsEl=[...t.querySelectorAll("tr")];const cols=Math.max(1,...rowsEl.map(r=>r.children.length));
  const cw=Math.floor(DW/cols);const rows=[];
  for(const tr of rowsEl){
    const cells=[];
    for(const td of tr.children){
      const ch=[];await blocks(td,ch,styleOf(td,td.tagName==="TH"?{...base,b:true}:base));
      if(!ch.length)ch.push(new docx.Paragraph({bidirectional:cfg.direction==="rtl",children:[]}));
      cells.push(new docx.TableCell({children:ch,width:{size:cw,type:docx.WidthType.DXA}}));
    }
    if(cells.length)rows.push(new docx.TableRow({children:cells}));
  }
  return new docx.Table({rows,columnWidths:Array(cols).fill(cw),width:{size:cw*cols,type:docx.WidthType.DXA},visuallyRightToLeft:cfg.direction==="rtl"});
}
async function blocks(root,out,base){
  for(const n of root.childNodes){
    if(n.nodeType===3){if(n.textContent.trim()){const r=[];await runs({childNodes:[n]},base,r);out.push(para(r,null))}continue}
    if(n.nodeType!==1)continue;
    const t=n.tagName.toLowerCase();
    if(t==="style"||t==="script")continue;
    if(t==="hr"){out.push(new docx.Paragraph({border:{bottom:{style:docx.BorderStyle.SINGLE,size:6,color:"999999",space:1}}}));continue}
    if(n.classList.contains("pb")){out.push(new docx.Paragraph({children:[new docx.PageBreak()]}));continue}
    if(t==="table"){out.push(await tbl(n,base));continue}
    if(t==="ul"||t==="ol"){
      const inst=++numN;
      for(const li of n.children)if(li.tagName.toLowerCase()==="li")await li2(li,t,inst,out,base,0);
      continue;
    }
    if(/^(p|div|h[1-6]|blockquote|pre)$/.test(t)){
      const b0={...base},hz={h1:48,h2:39,h3:33}[t];
      if(hz){b0.z=hz;b0.b=true}
      if(t==="blockquote")b0.c="555555";
      const st=styleOf(n,b0);
      const r=[];await runs(n,st,r);
      if(!r.length)r.push(new docx.TextRun({text:""}));
      out.push(para(r,n));
      continue;
    }
    const r=[];await runs({childNodes:[n]},base,r);out.push(para(r,null));
  }
}
async function buildDocx(){
  const pg=DPG[cfg.size]||DPG.A4,m=Math.round(cfg.margin*56.7);
  DW=pg[0]-2*m;numN=0;
  const root=document.createElement("div");root.innerHTML=sanitize(page.innerHTML);
  const out=[];await blocks(root,out,{z:28});
  if(!out.length)out.push(new docx.Paragraph({children:[]}));
  const lv=[0,1,2].map(i=>({level:i,format:"decimal",text:"%"+(i+1)+".",alignment:docx.AlignmentType.LEFT}));
  const doc=new docx.Document({
    title,creator:"المحرر العربي الاحترافي",
    numbering:{config:[{reference:"n",levels:lv}]},
    styles:{default:{document:{run:{font:"Tahoma",size:28,sizeComplexScript:28}}}},
    sections:[{properties:{page:{size:{width:pg[0],height:pg[1]},margin:{top:m,right:m,bottom:m,left:m}}},children:out}]
  });
  return docx.Packer.toBlob(doc);
}
async function exportDOCX(){
  status("جارٍ إنشاء Word...");
  try{if(await needDocx()){download(await buildDocx(),safeName()+".docx");return true}}catch(e){}
  try{
    const w=cleanBox();const h=w.innerHTML;w.remove();
    const html='<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40" dir="rtl" lang="ar"><head><meta charset="utf-8"><style>body{direction:rtl;text-align:right;font-family:Tahoma;font-size:14pt}table{border-collapse:collapse;width:100%}td,th{border:1px solid #666;padding:6px}</style></head><body dir="rtl">'+h+"</body></html>";
    download(new Blob(["\ufeff"+html],{type:"application/msword"}),safeName()+".doc");
    alert("تم تنزيل المستند بصيغة DOC.");return true;
  }catch(e){alert("تعذر تصدير Word.");return false}
}

/* ===== البحث والاستبدال ===== */
function openFind(){
  sIdx=-1;sM=[];
  $("modalHost").innerHTML='<div class="bd" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>بحث واستبدال</h3><input id="fq" placeholder="البحث عن..."><input id="rq" placeholder="استبدال بـ..."><div class="row"><button onclick="findNext()">بحث التالي</button><button onclick="replOne()">استبدال المحدد</button><button onclick="replAll()">استبدال الكل</button><button onclick="closeModal()">إغلاق</button></div></div></div>';
}
function nrm(t){
  let s="";const m=[];
  for(let i=0;i<t.length;i++){
    const c=t[i],k=c.charCodeAt(0);
    if((k>=0x64B&&k<=0x65F)||k===0x670||k===0x640)continue;
    let x=c;if("أإآٱ".indexOf(c)>=0)x="ا";else if(c==="ى")x="ي";else x=c.toLowerCase();
    s+=x;m.push(i);
  }
  return{s,m};
}
function matches(q){
  const nq=nrm(q).s;if(!nq)return[];
  const w=document.createTreeWalker(page,NodeFilter.SHOW_TEXT);const out=[];let n;
  while(n=w.nextNode()){
    const {s,m}=nrm(n.textContent);let p=0;
    while(true){
      const i=s.indexOf(nq,p);if(i<0)break;
      out.push({n,s:m[i],e:m[i+nq.length-1]+1});p=i+nq.length;
    }
  }
  return out;
}
function findNext(){
  const q=$("fq").value;if(!q){alert("اكتب كلمة للبحث.");return}
  sM=matches(q);if(!sM.length){alert("لا توجد مطابقة.");return}
  sIdx=(sIdx+1)%sM.length;const m=sM[sIdx];const r=document.createRange();
  r.setStart(m.n,m.s);r.setEnd(m.n,m.e);
  const s=getSelection();s.removeAllRanges();s.addRange(r);range0=r.cloneRange();
  if(m.n.parentElement)m.n.parentElement.scrollIntoView({behavior:"smooth",block:"center"});
  status("نتيجة "+(sIdx+1)+" من "+sM.length);
}
function replOne(){
  restore();const s=getSelection();
  if(!s||!s.rangeCount||s.isCollapsed){alert("حدد النص أولاً.");return}
  const rep=$("rq").value;
  if(rep)document.execCommand("insertText",false,rep);else document.execCommand("delete");
  stats();
}
function replAll(){
  const q=$("fq").value,rep=$("rq").value;if(!q){alert("اكتب النص المراد استبداله.");return}
  const ms=matches(q);if(!ms.length){alert("لا توجد مطابقة.");return}
  let c=0;
  for(let i=ms.length-1;i>=0;i--){
    const m=ms[i];
    try{
      const r=document.createRange();r.setStart(m.n,m.s);r.setEnd(m.n,m.e);
      const s=getSelection();s.removeAllRanges();s.addRange(r);
      if(rep)document.execCommand("insertText",false,rep);else document.execCommand("delete");
      c++;
    }catch(e){}
  }
  stats();alert("تم استبدال "+c+" موضعاً.");
}

/* ===== الاستيراد ===== */
async function importFile(inp){
  const f=inp.files[0];inp.value="";if(!f)return;
  if(f.type==="application/pdf"||/.pdf$/i.test(f.name)){await extractPDF(f);return}
  if(!confirm("سيتم فتح الملف كمستند جديد. متابعة؟"))return;
  try{
    let html;
    if(/.txt$/i.test(f.name)){html=textHTML(await f.text())}
    else if(/.html?$/i.test(f.name)){html=sanitize(new DOMParser().parseFromString(await f.text(),"text/html").body.innerHTML)}
    else if(/.docx$/i.test(f.name)){
      if(!window.mammoth){alert("مكتبة Word غير متاحة.");return}
      const res=await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()});
      html=sanitize(res.value);
    }else{alert("نوع الملف غير مدعوم.");return}
    if(!(await startFresh()))return;
    page.innerHTML=html||"<p><br></p>";
    title=f.name.replace(/\.[^.]+$/,"")||"مستند مستورد";
    $("docTitle").textContent=title;resetSel();stats();status("تم جلب الملف");
  }catch(e){alert("تعذر جلب الملف.")}
}
function textHTML(t){return t.split(/\r?\n/).map(l=>"<p>"+(esc(l)||"")+"</p>").join("")}
function showX(){$("xp").hidden=false;$("xp").scrollIntoView({behavior:"smooth"})}
function prog(m){$("xs")&&($("xs").textContent=m);status(m)}

let stopFlag=false,curPg=0;
async function ocrWorker(psm){
  if(!window.Tesseract)throw new Error("Tesseract غير متاحة");
  return await Tesseract.createWorker("ara+eng",1,{logger:m=>{if(m.status==="recognizing text")prog("OCR: "+Math.round((m.progress||0)*100)+"%")}});
}
function itemsText(items){
  const lines=[];let cur=[],y0=null;
  items.filter(x=>x.str).forEach(it=>{
    const y=it.transform[5];
    if(y0!==null&&Math.abs(y-y0)>4){lines.push(cur.join(" "));cur=[];}
    cur.push(it.str);y0=y;
    if(it.hasEOL){lines.push(cur.join(" "));cur=[];y0=null}
  });
  if(cur.length)lines.push(cur.join(" "));
  return lines.join("\n");
}
function needOcr(t){
  const a=(t.match(/[\u0600-\u06FF]/g)||[]).length,l=(t.match(/[A-Za-z]/g)||[]).length;
  return(a+l<15);
}
async function openPdf(file){
  if(!window.pdfjsLib)throw new Error("pdf.js غير متاحة");
  pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  return pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise;
}
function cleanText(t){return String(t||"").split(/\r?\n/).map(l=>l.trim()).filter(Boolean).join("\n")}
function toParas(text){return String(text).split(/\r?\n/).map(l=>l.trim()).filter(Boolean).map(p=>"<p>"+esc(p)+"</p>").join("")}

async function extractPDF(f){
  showX();$("xt").value="";prog("جارٍ قراءة PDF...");
  try{
    const pdf=await openPdf(f);let txt="";
    for(let i=1;i<=pdf.numPages;i++){
      const p=await pdf.getPage(i);
      const t=itemsText((await p.getTextContent()).items);
      txt+=(txt?"\n\n":"")+t;
    }
    $("xt").value=txt;prog("اكتمل استخراج النص.");
  }catch(e){prog("تعذرت قراءة PDF.")}
}

async function pdfToWord(inp){
  const f=inp.files[0];inp.value="";if(!f)return;
  if(!confirm("تحويل PDF إلى Word؟ سيُنشأ مستند جديد."))return;
  try{
    prog("جارٍ التحويل...");const pdf=await openPdf(f);let txt="";
    for(let i=1;i<=pdf.numPages;i++){
      const p=await pdf.getPage(i);
      txt+=(txt?"\n\n":"")+itemsText((await p.getTextContent()).items);
    }
    const html=toParas(txt);
    if(!html){prog("لم يُستخرج أي نص.");return}
    if(!(await startFresh()))return;
    page.innerHTML=html;title=f.name.replace(/\.pdf$/i,"")||"مستند من PDF";
    $("docTitle").textContent=title;resetSel();stats();
    if(await exportDOCX())prog("✓ تم التحويل وتنزيل ملف Word");
  }catch(e){prog("فشل التحويل.")}
}

async function runOCR(inp){
  const f=inp.files[0];inp.value="";if(!f)return;
  showX();prog("جارٍ التعرف على النص...");
  try{
    const w=await ocrWorker("3");
    $("xt").value=cleanText((await w.recognize(f)).data.text||"");
    await w.terminate();prog("اكتمل OCR.");
  }catch(e){prog("تعذر تشغيل OCR.")}
}

async function moveX(){
  const t=$("xt").value;if(!t.trim()){alert("لا يوجد نص.");return}
  if(!confirm("وضع النص المستخرج في مستند جديد؟"))return;
  if(!(await startFresh()))return;
  page.innerHTML=toParas(t)||"<p><br></p>";
  title="نص مستخرج";$("docTitle").textContent=title;
  $("xp").hidden=true;resetSel();stats();window.scrollTo({top:0,behavior:"smooth"});
}
function dlX(){download(new Blob(["\ufeff"+$("xt").value],{type:"text/plain;charset=utf-8"}),"النص_المستخرج.txt")}
