<script>
"use strict";
const $=id=>document.getElementById(id),page=$("page"),DB="ArabicProDocsDB",ST="documents";
let curId=null,title="مستند جديد",range0=null,timer=null,selImg=null,rev=0,savedRev=0,queue=Promise.resolve(),sIdx=-1,sM=[];
let cfg={size:"A4",margin:15,pattern:"none",direction:"rtl"};
const SIZES={A4:{w:794,pdf:"a4"},A5:{w:559,pdf:"a5"},Letter:{w:816,pdf:"letter"}};
const FONTS=["Cairo","Tahoma","Arial","Traditional Arabic","Simplified Arabic","Georgia","Times New Roman","Amiri"];
const FS=[["14px","14 صغير"],["16px","16 عادي"],["18px","18"],["20px","20"],["24px","24 كبير"],["28px","28"],["32px","32 عنوان"],["40px","40"]];
const MENU=[
{t:"📁 ملف",i:[["＋ مستند جديد",()=>newDoc()],["📚 مستنداتي",()=>openDocs()],["💾 حفظ الآن",()=>saveNow(false)],["✏️ تسمية المستند",()=>renameDoc()],["📥 جلب ملف (Word/PDF/TXT/HTML)",()=>$("importInput").click()],["🖨 طباعة",()=>window.print()],["🗑 مسح المحتوى",()=>clearDoc(),"dg"]]},
{t:"📤 تصدير",i:[["📝 Word ‏(.docx)",()=>exportDOCX()],["📄 PDF",()=>exportPDF()],["🖼 صورة PNG",()=>exportImage(false)],["🖼 صور بالصفحات",()=>exportImage(true)],["🌐 HTML",()=>exportHTML()],["📃 TXT",()=>exportTXT()]]},
{t:"📑 PDF وOCR",i:[["🔄 تحويل PDF إلى Word",()=>$("p2wInput").click()],["📖 قراءة نص PDF",()=>$("pdfInput").click()],["👁️ OCR لصورة",()=>$("ocrInput").click()],["📜 عرض النص المستخرج",()=>showX()]]},
{t:"🎨 المظهر",i:[["☀️ نهار",()=>setTheme("light")],["📜 ورق",()=>setTheme("sepia")],["🌙 داكن",()=>setTheme("dark")]]},
{t:"✏️ تنسيق النص",i:[["غامق",()=>cmd("bold")],["مائل",()=>cmd("italic")],["تسطير",()=>cmd("underline")],["يتوسطه خط",()=>cmd("strikeThrough")],["إزالة التنسيق",()=>cmd("removeFormat")],["↶ تراجع",()=>cmd("undo")],["↷ إعادة",()=>cmd("redo")]]},
{t:"🔤 الخط واللون",i:[{s:1,ph:"نوع الخط",o:FONTS.map(x=>[x,x]),f:v=>cmd("fontName",v)},{s:1,ph:"حجم الخط",o:FS,f:v=>setSize(v)},{c:1,l:"لون النص",v:"#111111",f:v=>cmd("foreColor",v)},{c:1,l:"تمييز النص",v:"#fff176",f:v=>cmd("hiliteColor",v)}]},
{t:"☰ الفقرة",i:[["يمين",()=>cmd("justifyRight")],["وسط",()=>cmd("justifyCenter")],["يسار",()=>cmd("justifyLeft")],["ضبط",()=>cmd("justifyFull")],["• قائمة نقطية",()=>cmd("insertUnorderedList")],["١. قائمة رقمية",()=>cmd("insertOrderedList")],["اتجاه RTL",()=>setDir("rtl")],["اتجاه LTR",()=>setDir("ltr")]]},
{t:"➕ إدراج",i:[["عنوان H1",()=>cmd("formatBlock","h1")],["عنوان H2",()=>cmd("formatBlock","h2")],["عنوان H3",()=>cmd("formatBlock","h3")],["خط فاصل",()=>ins("<hr><p><br></p>")],["اقتباس",()=>ins("<blockquote>اكتب الاقتباس...</blockquote><p><br></p>")],["📊 جدول",()=>insTable()],["＋ صف",()=>tRow()],["＋ عمود",()=>tCol()],["فاصل صفحة",()=>ins('<div class="pb"></div><p><br></p>')],["📷 رفع صورة",()=>pickImg()],["🔗 رابط",()=>link()],["إزالة الرابط",()=>cmd("unlink")]]},
{t:"📄 الصفحة",i:[{s:1,id:"paperSize",ph:"حجم الورق",o:[["A4","A4"],["A5","A5"],["Letter","Letter"]],f:v=>{cfg.size=v;applyCfg();sched()},keep:1},{s:1,id:"pat",ph:"نقش الخلفية",o:[["none","بدون"],["dots","نقاط"],["lines","خطوط"],["grid","مربعات"]],f:v=>setPat(v),keep:1},["🔍 بحث واستبدال",()=>openFind()]]},
{t:"🖼 الصورة المحددة",i:[["⬇ تحميل الصورة",()=>dlImg()],["تكبير",()=>rsz(1.1)],["تصغير",()=>rsz(.9)],["يمين",()=>alImg("right")],["وسط",()=>alImg("center")],["يسار",()=>alImg("left")],["حذف الصورة",()=>delImg(),"dg"]]}
];
function status(m){$("status").textContent=m}
function esc(v){return String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function safeName(){return(title||"مستندي").replace(/[\\/:*?"<>|]/g,"_").slice(0,100)}
function setTheme(n){document.body.dataset.theme=n;try{localStorage.setItem("ape-theme",n)}catch(e){}}
function mkItem(it){
 let el;
 if(it.s){el=document.createElement("select");if(it.id)el.id=it.id;
  el.innerHTML='<option value="">'+it.ph+"</option>"+it.o.map(o=>'<option value="'+o[0]+'">'+o[1]+"</option>").join("");
  if(it.id==="paperSize")el.value=cfg.size;if(it.id==="pat")el.value=cfg.pattern;
  el.onchange=()=>{if(!el.value)return;it.f(el.value);if(!it.keep)el.selectedIndex=0;closeMenu()}}
 else if(it.c){el=document.createElement("label");el.className="m-l";el.innerHTML="<span>"+it.l+"</span>";
  const i=document.createElement("input");i.type="color";i.value=it.v;i.oninput=()=>it.f(i.value);el.appendChild(i)}
 else{el=document.createElement("button");el.textContent=it[0];if(it[2])el.className=it[2];el.onclick=()=>{closeMenu();it[1]()}}
 return el;
}
function buildMenu(){
 const bar=$("mbar");bar.innerHTML="";
 MENU.forEach((gr,gi)=>{
  const b=document.createElement("button");b.textContent=gr.t.replace(/^\S+\s/,"");
  b.onclick=e=>{e.stopPropagation();openGroup(gi,b)};bar.appendChild(b);
 });
}
function openGroup(gi,btn){
 const menu=$("menu");
 if(!menu.hidden&&menu.dataset.g==gi){closeMenu();return}
 closeMenu();menu.dataset.g=gi;menu.innerHTML="";
 MENU[gi].i.forEach(it=>menu.appendChild(mkItem(it)));
 menu.hidden=false;btn.classList.add("on");
}
function svgAl(a){
 const w=[14,9,14,6];let d="";
 w.forEach((x,i)=>{const y=3+i*3.4,x1=a==="j"?1:a==="r"?15-x:a==="l"?1:(16-x)/2,x2=a==="j"?15:x1+x;d+="M"+x1+" "+y+"H"+x2});
 return '<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6"><path d="'+d+'"/></svg>';
}
function link(){
 restore();const u=prompt("عنوان الرابط:","https://");
 if(!u||u==="https://")return;
 cmd("createLink",/^(https?:|mailto:)/i.test(u.trim())?u.trim():"https://"+u.trim());
}
function buildQuick(){
 const q=$("quick");
 const sep=()=>{const s=document.createElement("span");s.className="sep";q.appendChild(s)};
 const btn=(h,t,f,c)=>{const b=document.createElement("button");b.innerHTML=h;b.title=t;b.setAttribute("aria-label",t);if(c)b.className=c;b.onclick=e=>{e.stopPropagation();closeMenu();f()};q.appendChild(b)};
 const sel=(ph,o,f)=>{const s=document.createElement("select");s.title=ph;s.innerHTML='<option value="">'+ph+"</option>"+o.map(x=>'<option value="'+x[0]+'">'+x[1]+"</option>").join("");s.onchange=()=>{if(s.value)f(s.value);s.selectedIndex=0};q.appendChild(s)};
 const col=(t,v,c)=>{const l=document.createElement("input");l.type="color";l.value=v;l.title=t;l.oninput=()=>cmd(c,l.value);q.appendChild(l)};
 btn("↶","تراجع",()=>cmd("undo"));btn("↷","إعادة",()=>cmd("redo"));sep();
 sel("النمط",[["p","فقرة"],["h1","عنوان 1"],["h2","عنوان 2"],["h3","عنوان 3"]],v=>cmd("formatBlock",v));
 sel("الخط",FONTS.map(x=>[x,x]),v=>cmd("fontName",v));
 sel("الحجم",FS,v=>setSize(v));sep();
 btn("<b>B</b>","غامق",()=>cmd("bold"));btn("<i>I</i>","مائل",()=>cmd("italic"));btn("<u>U</u>","تسطير",()=>cmd("underline"));btn("<s>S</s>","يتوسطه خط",()=>cmd("strikeThrough"));sep();
 col("لون النص","#111111","foreColor");col("تمييز","#fff176","hiliteColor");sep();
 btn(svgAl("r"),"يمين",()=>cmd("justifyRight"));btn(svgAl("c"),"وسط",()=>cmd("justifyCenter"));btn(svgAl("l"),"يسار",()=>cmd("justifyLeft"));btn(svgAl("j"),"ضبط",()=>cmd("justifyFull"));sep();
 btn("•","قائمة نقطية",()=>cmd("insertUnorderedList"));btn("1.","قائمة رقمية",()=>cmd("insertOrderedList"));sep();

}
function closeMenu(){$("menu").hidden=true;document.querySelectorAll("#mbar .on").forEach(x=>x.classList.remove("on"))}

function sanitize(html){
 const d=new DOMParser().parseFromString(String(html),"text/html");
 d.querySelectorAll("script,iframe,object,embed,form,link,meta,base,style").forEach(e=>e.remove());
 d.querySelectorAll("*").forEach(el=>[...el.attributes].forEach(a=>{
  const n=a.name.toLowerCase(),v=a.value.trim();
  if(n.startsWith("on")||n==="srcdoc"||n==="formaction")el.removeAttribute(a.name);
  else if(["href","src","xlink:href"].includes(n)&&(/^\s*(javascript|vbscript):/i.test(v)||/^data:text\/html/i.test(v)))el.removeAttribute(a.name);
  else if(n==="style"&&/expression\s*\(|javascript\s*:/i.test(v))el.removeAttribute(a.name);
 }));
 return d.body.innerHTML;
}

/* التخزين المحلي */
function openDB(){return new Promise((res,rej)=>{
 if(!window.indexedDB)return rej(new Error("no idb"));
 const r=indexedDB.open(DB,1);
 r.onupgradeneeded=()=>{if(!r.result.objectStoreNames.contains(ST))r.result.createObjectStore(ST,{keyPath:"id"})};
 r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);
})}
async function dbOp(mode,fn){
 const db=await openDB();
 return new Promise((res,rej)=>{
  const tx=db.transaction(ST,mode),rq=fn(tx.objectStore(ST));
  tx.oncomplete=()=>{db.close();res(rq&&rq.result)};
  tx.onerror=tx.onabort=()=>{db.close();rej(tx.error)};
 });
}
const dbPut=d=>dbOp("readwrite",s=>s.put(d)),dbAll=()=>dbOp("readonly",s=>s.getAll()),dbDel=id=>dbOp("readwrite",s=>s.delete(id));

function applyCfg(){
 page.style.width=(SIZES[cfg.size]||SIZES.A4).w+"px";
 page.style.padding=Math.round(cfg.margin*3.78)+"px";
 page.dir=cfg.direction;page.style.textAlign=cfg.direction==="ltr"?"left":"right";
 if($("paperSize"))$("paperSize").value=cfg.size;if($("pat"))$("pat").value=cfg.pattern;
 setPat(cfg.pattern,false);
}
function setPat(t,save=true){
 const p={none:"none",dots:"radial-gradient(rgba(0,0,0,.15) 1px,transparent 1px)",lines:"repeating-linear-gradient(transparent,transparent 31px,rgba(0,0,0,.08) 32px)",grid:"linear-gradient(rgba(0,0,0,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(0,0,0,.07) 1px,transparent 1px)"};
 cfg.pattern=t;page.style.backgroundImage=p[t]||"none";page.style.backgroundSize=t==="dots"?"18px 18px":t==="grid"?"24px 24px":"auto";
 if(save)sched();
}
function setDir(d){cfg.direction=d;applyCfg();sched()}

/* الحفظ */
function sched(){rev++;clearTimeout(timer);status("⏳ جارٍ الحفظ...");timer=setTimeout(()=>saveNow(true),900)}
async function saveNow(silent){
 clearTimeout(timer);timer=null;
 const target=rev;
 if(!curId)curId="doc_"+Date.now()+"_"+Math.random().toString(36).slice(2,8);
 const snap={id:curId,title,html:page.innerHTML,config:{...cfg},updated:Date.now()};
 const task=queue.catch(()=>{}).then(()=>dbPut(snap));queue=task;
 try{await task;savedRev=Math.max(savedRev,target);status("✓ تم الحفظ على الجهاز");if(!silent)alert("تم حفظ المستند.");return true}
 catch(e){console.error(e);status("⚠ تعذر الحفظ");if(!silent)alert("تعذر الحفظ. تحقق من مساحة التخزين.");return false}
}
async function flush(){if(savedRev>=rev)return true;return saveNow(true)}
function blank(){
 curId=null;title="مستند جديد";page.innerHTML="<p><br></p>";
 cfg={size:"A4",margin:15,pattern:"none",direction:"rtl"};
 rev++;savedRev=rev;resetSel();applyCfg();$("docTitle").textContent=title;stats(false);
}
async function newDoc(){
 if(!confirm("إنشاء مستند جديد؟ سيتم حفظ الحالي أولاً."))return;
 if(!(await flush())){alert("تعذر حفظ المستند الحالي.");return}
 blank();status("مستند جديد");window.scrollTo(0,0);page.focus();
}

async function openDocs(){

   const info=document.createElement("div");info.innerHTML="<b>"+esc(d.title||"بلا عنوان")+"</b><br><small>"+new Date(d.updated||Date.now()).toLocaleString("ar-IQ")+"</small>";
   const a=document.createElement("div");
   const o=document.createElement("button");o.textContent="فتح";o.onclick=async()=>{const all=await dbAll();const x=all.find(z=>z.id===d.id);if(x){await flush();applyDoc(x);closeModal()}};

function setSize(sz){
 restore();const s=getSelection();
 if(s&&s.rangeCount&&s.isCollapsed&&page.contains(s.anchorNode)){let bk=s.anchorNode;if(bk.nodeType===3)bk=bk.parentElement;bk=bk.closest("p,h1,h2,h3,li,blockquote,td,th");if(bk&&page.contains(bk)){const rg=document.createRange();rg.selectNodeContents(bk);s.removeAllRanges();s.addRange(rg)}}

function loadScript(u){return new Promise((r,j)=>{const e=document.createElement("script");e.src=u;e.onload=r;e.onerror=j;document.head.appendChild(e)})}
async function needDocx(){
 if(window.docx)return true;
 for(const u of ["https://cdn.jsdelivr.net/npm/docx@7.8.2/build/index.js","https://unpkg.com/docx@7.8.2/build/index.js","https://cdn.jsdelivr.net/npm/docx@8.5.0/build/index.umd.js"]){
  try{await loadScript(u);if(window.docx)return true}catch(e){}

const RTLRE=/[\u0590-\u08FF\uFB50-\uFDFF\uFE70-\uFEFF]/,DPG={A4:[11906,16838],A5:[8391,11906],Letter:[12240,15840]};
let DW=9000,numN=0;
function hexOf(c){
 if(!c)return;c=c.trim();
 if(c[0]==="#"){c=c.slice(1);if(c.length===3)c=c.replace(/./g,"$&$&");return c.length===6?c.toUpperCase():undefined}
 const m=c.match(/[\d.]+/g);if(!m||m.length<3)return;if(m.length>3&&+m[3]===0)return;
 return m.slice(0,3).map(x=>(Math.round(+x)).toString(16).padStart(2,"0")).join("").toUpperCase();
}
function styleOf(el,st){
 const n={...st},t=el.tagName.toLowerCase(),s=el.style||{};
 if(t==="b"||t==="strong"||/^h[1-6]$/.test(t))n.b=true;
 if(t==="i"||t==="em")n.i=true;
 if(t==="u"||t==="a")n.u=true;
 if(t==="s"||t==="strike"||t==="del")n.s=true;
 if(t==="a")n.c="0563C1";
 if(/^(bold|[6-9]00)$/.test(s.fontWeight))n.b=true;
 if(s.fontStyle==="italic")n.i=true;
 const td=s.textDecorationLine||s.textDecoration||"";
 if(/underline/.test(td))n.u=true;if(/line-through/.test(td))n.s=true;
 const c=hexOf(s.color);
 if(c&&!(parseInt(c.slice(0,2),16)>235&&parseInt(c.slice(2,4),16)>235&&parseInt(c.slice(4,6),16)>235))n.c=c;
 const bg=hexOf(s.backgroundColor);if(bg)n.bg=bg;
 if(s.fontSize){const m=s.fontSize.match(/([\d.]+)px/);if(m)n.z=Math.round(m[1]*1.5)}
 if(s.fontFamily)n.f=s.fontFamily.split(",")[0].replace(/["']/g,"").trim();
 return n;
}
function fmt(st,t){
 const z=st.z||28;
 return{text:t,bold:!!st.b,boldComplexScript:!!st.b,italics:!!st.i,italicsComplexScript:!!st.i,underline:st.u?{}:undefined,strike:!!st.s,color:st.c,size:z,sizeComplexScript:z,font:st.f||"Tahoma",rightToLeft:cfg.direction==="rtl"&&RTLRE.test(t),shading:st.bg?{type:docx.ShadingType.CLEAR,color:"auto",fill:st.bg}:undefined};
}
function imgRun(im){
 return new Promise(res=>{
  const i=new Image();
  i.onload=()=>{try{
   let w=i.naturalWidth||300,h=i.naturalHeight||200;
   const sw=parseFloat(im.style.width)||0;if(sw){h=h*sw/w;w=sw}
   const max=(SIZES[cfg.size]||SIZES.A4).w-2*Math.round(cfg.margin*3.78);
   if(w>max){h=h*max/w;w=max}
   const c=document.createElement("canvas");c.width=i.naturalWidth;c.height=i.naturalHeight;c.getContext("2d").drawImage(i,0,0);
   const b=atob(c.toDataURL("image/png").split(",")[1]),u=new Uint8Array(b.length);for(let k=0;k<b.length;k++)u[k]=b.charCodeAt(k);
   res(new docx.ImageRun({data:u,type:"png",transformation:{width:Math.round(w),height:Math.round(h)}}));
  }catch(e){console.warn(e);res(null)}};
  i.onerror=()=>res(null);i.src=im.src;
 });
}
async function runs(node,st,out){
 for(const n of node.childNodes){
  if(n.nodeType===3){const t=n.textContent.replace(/[\r\n\t ]+/g," ");if(t)out.push(new docx.TextRun(fmt(st,t)))}
  else if(n.nodeType===1){
   const t=n.tagName.toLowerCase();
   if(t==="br")out.push(new docx.TextRun({break:1}));
   else if(t==="img"){const r=await imgRun(n);if(r)out.push(r)}
   else if(!/^(ul|ol|table|style|script)$/.test(t))await runs(n,styleOf(n,st),out);
  }
 }
}
function para(r,el,o){
 const ta=(el&&el.style&&el.style.textAlign)||"",A=docx.AlignmentType,rtl=cfg.direction==="rtl";
 let al;
 if(ta==="center")al=A.CENTER;else if(ta==="justify")al=A.BOTH;
 else if(rtl&&ta==="left")al=A.RIGHT;else if(!rtl&&ta==="right")al=A.RIGHT;
 return new docx.Paragraph({children:r,bidirectional:rtl,alignment:al,spacing:{after:120,line:360},...(o||{})});
}
async function li2(li,t,inst,out,base,lvl){
 const r=[];await runs(li,styleOf(li,base),r);
 out.push(para(r,li,t==="ul"?{bullet:{level:lvl}}:{numbering:{reference:"n",level:lvl,instance:inst}}));
 for(const c of li.children){
  const ct=c.tagName.toLowerCase();
  if(ct==="ul"||ct==="ol"){const i2=++numN;for(const l2 of c.children)if(l2.tagName.toLowerCase()==="li")await li2(l2,ct,i2,out,base,Math.min(lvl+1,2))}
 }
}
async function tbl(t,base){
 const rowsEl=[...t.querySelectorAll("tr")],cols=Math.max(1,...rowsEl.map(r=>r.children.length)),cw=Math.floor(DW/cols),rows=[];
 for(const tr of rowsEl){
  const cells=[];
  for(const td of tr.children){
   const ch=[];await blocks(td,ch,styleOf(td,td.tagName==="TH"?{...base,b:true}:base));
   if(!ch.length)ch.push(new docx.Paragraph({bidirectional:cfg.direction==="rtl",children:[]}));
   cells.push(new docx.TableCell({children:ch,width:{size:cw,type:docx.WidthType.DXA}}));
  }
  if(cells.length)rows.push(new docx.TableRow({children:cells}));
 }
 return new docx.Table({rows,columnWidths:Array(cols).fill(cw),width:{size:cw*cols,type:docx.WidthType.DXA},visuallyRightToLeft:cfg.direction==="rtl"});
}
async function blocks(root,out,base){
 for(const n of root.childNodes){
  if(n.nodeType===3){if(n.textContent.trim()){const r=[];await runs({childNodes:[n]},base,r);out.push(para(r,null))}continue}
  if(n.nodeType!==1)continue;
  const t=n.tagName.toLowerCase();
  if(t==="style"||t==="script")continue;
  if(t==="hr"){out.push(new docx.Paragraph({border:{bottom:{style:docx.BorderStyle.SINGLE,size:6,color:"999999",space:1}}}));continue}
  if(n.classList.contains("pb")){out.push(new docx.Paragraph({children:[new docx.PageBreak()]}));continue}
  if(t==="table"){out.push(await tbl(n,base));continue}
  if(t==="ul"||t==="ol"){const inst=++numN;for(const li of n.children)if(li.tagName.toLowerCase()==="li")await li2(li,t,inst,out,base,0);continue}
  if(/^(p|div|h[1-6]|blockquote|pre)$/.test(t)){
   const b0={...base},hz={h1:48,h2:39,h3:33}[t];
   if(hz){b0.z=hz;b0.b=true}
   if(t==="blockquote")b0.c="555555";
   const st=styleOf(n,b0);
   if([...n.children].some(c=>/^(p|div|h[1-6]|ul|ol|table|blockquote|hr)$/.test(c.tagName.toLowerCase())))await blocks(n,out,st);
   else{const r=[];await runs(n,st,r);if(!r.length)r.push(new docx.TextRun({text:""}));out.push(para(r,n))}
   continue;
  }
  const r=[];await runs({childNodes:[n]},base,r);out.push(para(r,null));
 }
}
async function buildDocx(){
 const pg=DPG[cfg.size]||DPG.A4,m=Math.round(cfg.margin*56.7);DW=pg[0]-2*m;numN=0;
 const root=document.createElement("div");root.innerHTML=sanitize(page.innerHTML);
 const out=[];await blocks(root,out,{z:28});
 if(!out.length)out.push(new docx.Paragraph({children:[]}));
 const lv=[0,1,2].map(i=>({level:i,format:"decimal",text:"%"+(i+1)+".",alignment:docx.AlignmentType.LEFT}));
 const doc=new docx.Document({title:title,creator:"المحرر العربي الاحترافي",numbering:{config:[{reference:"n",levels:lv}]},styles:{default:{document:{run:{font:"Tahoma",size:28,sizeComplexScript:28}}}},sections:[{properties:{page:{size:{width:pg[0],height:pg[1]},margin:{top:m,right:m,bottom:m,left:m}}},children:out}]});
 return docx.Packer.toBlob(doc);
}

/* البحث والاستبدال */
function openFind(){
 sIdx=-1;sM=[];
 $("modalHost").innerHTML='<div class="bd" onclick="if(event.target===this)closeModal()"><div class="modal"><h3>بحث واستبدال</h3><input id="fq" placeholder="البحث عن..."><input id="rq" placeholder="استبدال بـ..."><div class="row"><button onclick="findNext()">بحث التالي</button><button onclick="replOne()">استبدال المحدد</button><button onclick="replAll()">استبدال الكل</button><button onclick="closeModal()">إغلاق</button></div></div></div>';
}
function matches(q){
 const w=document.createTreeWalker(page,NodeFilter.SHOW_TEXT),out=[];let n;
 while((n=w.nextNode())){let s=0;while(true){const i=n.textContent.indexOf(q,s);if(i<0)break;out.push({n,s:i,e:i+q.length});s=i+q.length}}
 return out;
}
function findNext(){
 const q=$("fq").value;if(!q){alert("اكتب كلمة للبحث.");return}
 sM=matches(q);if(!sM.length){alert("لا توجد مطابقة.");return}
 sIdx=(sIdx+1)%sM.length;const m=sM[sIdx],r=document.createRange();r.setStart(m.n,m.s);r.setEnd(m.n,m.e);
 const s=getSelection();s.removeAllRanges();s.addRange(r);range0=r.cloneRange();
 m.n.parentElement.scrollIntoView({behavior:"smooth",block:"center"});status("نتيجة "+(sIdx+1)+" من "+sM.length);
}
function replOne(){
 const s=getSelection();if(!s||s.isCollapsed||!page.contains(s.anchorNode)){alert("حدد النص أولاً (بحث التالي).");return}
 page.focus();document.execCommand("insertText",false,$("rq").value);stats();
}
function replAll(){
 const q=$("fq").value,r=$("rq").value;if(!q){alert("اكتب النص المراد استبداله.");return}
 const by=new Map();matches(q).forEach(m=>by.set(m.n,1));let c=0;
 by.forEach((_,n)=>{const p=n.textContent.split(q);c+=p.length-1;n.textContent=p.join(r)});
 stats();alert("تم استبدال "+c+" موضعاً.");
}

/* الاستيراد: Word / PDF / TXT / HTML */
async function importFile(inp){
 const f=inp.files[0];inp.value="";if(!f)return;
 const isPdf=f.type==="application/pdf"||/\.pdf$/i.test(f.name);
 if(isPdf){await extractPDF(f);status("تم استخراج نص PDF — انقله للمحرر من اللوحة");return}
 if(!confirm("سيتم استبدال محتوى المحرر بالملف المستورد. متابعة؟"))return;
 try{
  if(/\.txt$/i.test(f.name))page.innerHTML=textHTML(await f.text());
  else if(/\.html?$/i.test(f.name))page.innerHTML=sanitize(new DOMParser().parseFromString(await f.text(),"text/html").body.innerHTML);
  else if(/\.docx$/i.test(f.name)){
   if(!window.mammoth){alert("مكتبة Word غير متاحة.");return}
   page.innerHTML=sanitize((await mammoth.convertToHtml({arrayBuffer:await f.arrayBuffer()})).value);
  }else{alert("نوع الملف غير مدعوم. المدعوم: docx, pdf, txt, html");return}
  title=f.name.replace(/\.[^.]+$/,"")||title;$("docTitle").textContent=title;
  resetSel();stats();status("تم جلب الملف");
 }catch(e){console.error(e);alert("تعذر جلب الملف.")}
}
function textHTML(t){return t.split(/\r?\n/).map(l=>"<p>"+(esc(l)||"<br>")+"</p>").join("")}
function showX(){$("xp").hidden=false;$("xp").scrollIntoView({behavior:"smooth"})}
function prog(m){$("xs").textContent=m;status(m)}
async function ocrWorker(){
 if(!window.Tesseract)throw new Error("OCR");
 return Tesseract.createWorker("ara+eng",1,{logger:m=>{if(m.status)prog(m.status+" "+Math.round((m.progress||0)*100)+"%")}});
}
function itemsText(items){
 const lines=[];let cur=[],y0=null;
 items.filter(x=>x.str).forEach(it=>{
  const y=it.transform[5];
  if(y0!==null&&Math.abs(y-y0)>4){lines.push(cur.join(" "));cur=[]}
  cur.push(it.str);y0=y;
  if(it.hasEOL){lines.push(cur.join(" "));cur=[];y0=null}
 });
 if(cur.length)lines.push(cur.join(" "));
 return lines.join("\n");
}
async function readPdf(file){
 if(!window.pdfjsLib)throw new Error("pdfjs");
 pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise,pages=[];let wk=null;
 try{
  for(let i=1;i<=pdf.numPages;i++){
   const p=await pdf.getPage(i);prog("الصفحة "+i+" من "+pdf.numPages);
   let t=itemsText((await p.getTextContent()).items);
   if(t.replace(/\s/g,"").length<15){
    prog("الصفحة "+i+" صورة، تشغيل OCR...");
    if(!wk)wk=await ocrWorker();
    const vp=p.getViewport({scale:2}),c=document.createElement("canvas");c.width=vp.width;c.height=vp.height;
    await p.render({canvasContext:c.getContext("2d"),viewport:vp}).promise;
    t=(await wk.recognize(c)).data.text||"";
   }
   pages.push(t);
  }
 }finally{if(wk)try{await wk.terminate()}catch(e){}}
 return pages;
}
async function extractPDF(f){
 showX();$("xt").value="";prog("جارٍ قراءة PDF...");
 try{$("xt").value=(await readPdf(f)).join("\n\n");prog("اكتمل استخراج النص.")}
 catch(e){console.error(e);prog("تعذرت قراءة PDF.")}
}
async function pdfToWord(inp){
 const f=inp.files[0];inp.value="";if(!f)return;
 if(!confirm("تحويل PDF إلى Word؟ سيحل محتواه محل محتوى المحرر ثم يُنزَّل ملف Word."))return;
 try{
  prog("جارٍ التحويل...");
  const pages=await readPdf(f);
  page.innerHTML=pages.map(textHTML).join('<div class="pb"></div>');
  title=f.name.replace(/\.pdf$/i,"")||title;$("docTitle").textContent=title;
  resetSel();stats();
  if(await exportDOCX())prog("✓ تم التحويل وتنزيل ملف Word.");
 }catch(e){console.error(e);prog("فشل التحويل.");alert("تعذر تحويل PDF إلى Word.")}
}
async function runOCR(inp){
 const f=inp.files[0];inp.value="";if(!f)return;
 showX();prog("جارٍ التعرف على النص...");let w=null;
 try{w=await ocrWorker();$("xt").value=(await w.recognize(f)).data.text||"";prog("اكتمل OCR.")}
 catch(e){console.error(e);prog("تعذر تشغيل OCR.")}
 finally{if(w)try{await w.terminate()}catch(e){}}
}
function moveX(){
 const t=$("xt").value;if(!t.trim()){alert("لا يوجد نص.");return}
 if(!confirm("استبدال محتوى المحرر بالنص المستخرج؟"))return;
 page.innerHTML=textHTML(t);$("xp").hidden=true;resetSel();stats();scrollTo({top:0,behavior:"smooth"});
}
function dlX(){download(new Blob(["\ufeff"+$("xt").value],{type:"text/plain;charset=utf-8"}),"النص_المستخرج.txt")}

$("imageInput").onchange=function(){addImgs(this)};
$("importInput").onchange=function(){importFile(this)};
$("pdfInput").onchange=function(){const f=this.files[0];this.value="";if(f)extractPDF(f)};
$("p2wInput").onchange=function(){pdfToWord(this)};
$("ocrInput").onchange=function(){runOCR(this)};
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")flush()});
addEventListener("pagehide",()=>flush());

window.addEventListener("DOMContentLoaded",async()=>{
 try{const t=localStorage.getItem("ape-theme");if(t)document.body.dataset.theme=t}catch(e){}
 buildQuick();buildMenu();applyCfg();
 try{const all=await dbAll();if(all.length){applyDoc(all.sort((a,b)=>(b.updated||0)-(a.updated||0))[0]);status("تم استرجاع آخر مستند")}else{stats(false);status("جاهز للكتابة")}}
 catch(e){stats(false);status("جاهز للكتابة")}
});
